appId: app.axiom.terminal
productName: AXIOM
copyright: Copyright © 2026 AXIOM Intelligence

# Mac only for now
mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  darkModeSupport: true
  minimumSystemVersion: '11.0'  # macOS Big Sur minimum

dmg:
  title: AXIOM Terminal
  # Standard Mac DMG layout:
  # App icon left, Applications folder shorthand right
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# TEMPORARILY DISABLED: Notarization bypassed for direct distribution
# afterSign: scripts/notarize.js

directories:
  output: dist
  buildResources: resources

files:
  - dist/**
  - renderer/**
  - "!**/*.map"
  - "!**/*.pyc"
  - "!**/__pycache__"
  - "!**/node_modules/.cache"

extraResources:
  - from: resources/python-runtime
    to: python-runtime
    filter:
      - "**/*"
      - "!**/*.pyc"

  - from: ../ml-engine/src
    to: ml-engine/src
    filter:
      - "**/*.py"
      - "**/*.db"
      - "**/*.json"
      - "!**/__pycache__"
      - "!**/*.pyc"

  - from: ../ml-engine/requirements.txt
    to: ml-engine/requirements.txt

publish:
  provider: github
  owner: irongopher75
  repo: Axiom
  releaseType: release
  updaterCacheDirName: axiom-updater
